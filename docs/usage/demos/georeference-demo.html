<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yesterdays georeference placement example</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK"
        crossorigin="anonymous">
    <link rel="stylesheet" href="ui-demo.css">
    <link rel="stylesheet" href="georeference-joystick.css">
    <link rel="stylesheet" href="georeference-demo.css">
    <script
        src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"
        integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp"
        crossorigin="anonymous"
        defer></script>
    <script src="ui-demo.js" defer></script>
    <script src="georeference-demo.js" defer></script>
</head>
<body>
    <main class="demo-stage demo-stage--georeference" data-demo-stage>
        <section class="georeference-demo" aria-label="Interactive georeferencing example">
            <div
                id="georeference-demo-map"
                aria-label="Map of Richmond. Click to place the camera location.">
            </div>

            <div class="georeference-demo-controls">
                <div
                    id="joystick-container"
                    aria-label="Camera direction joystick"
                    aria-disabled="true">
                    <div id="joystick-handle"></div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
