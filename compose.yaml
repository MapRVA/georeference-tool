# Local dev stack: Postgres, RabbitMQ, Memgraph (+ Lab), Django, two Celery
# workers, and Vite. Run with `docker compose up`.
#
# Django/Celery/Vite share one image (the `dev` target in Containerfile, with
# uv and bun). Source is bind-mounted for live reload; the venv lives in the
# image, so run `docker compose build` after dependency changes.
#
# my.env only supplies the external secrets (Cloudflare R2, Protomaps); every
# dev connection setting and feature flag is set in the `environment:` block
# below, pointing at the sibling services. Only web, vite, the RabbitMQ
# management UI, Memgraph (Bolt + log websocket, for host-side clients and
# Lab), and Memgraph Lab publish host ports; everything else (Postgres, the
# RabbitMQ broker) talks over the Compose network by service name, so those
# ports stay internal. Run host-side Django/Celery via
# `docker compose exec web …` since localhost no longer reaches the DB/broker.

name: yesterdays

x-build: &build
  context: .
  dockerfile: Containerfile
  target: dev

# Shared config for the Python services (web, workers, beat).
x-app: &app
  build: *build
  env_file: my.env
  environment:
    # DB connection — PG_HOST/PG_PORT target the postgres service; the
    # credentials must match the POSTGRES_* values it initialises with.
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_DBNAME: georef
    PG_USER: django_user
    PG_PASSWORD: dev_password
    PG_SSL_MODE: disable
    # Broker, graph store, and CLIP embedding service, reached by service name.
    CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    MEMGRAPH_URL: bolt://memgraph:7687
    CLIP_SERVICE_URL: http://clip:8000
    # Non-secret dev settings; real secrets (R2, Protomaps) stay in my.env.
    LOCAL_DEV: "0"
    ALLOW_HARDCODED_ADMIN: "1"
    DJANGO_DEBUG: "1"
    DJANGO_VITE_DEV_MODE: "True"
    # Must match vite's published host port (below) — this is the URL the
    # browser uses to fetch assets, not an in-network address.
    DJANGO_VITE_DEV_PORT: "${VITE_PORT:-5173}"
  volumes:
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    memgraph:
      condition: service_started
    clip:
      condition: service_started

services:
  postgres:
    image: ghcr.io/maprva/postgis-pgvector-local:latest
    environment:
      POSTGRES_DB: georef
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user -d georef"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management
    ports:
      # Broker (5672) stays internal; only the management UI is published.
      # Host port is configurable to dodge collisions with other projects:
      # `RABBITMQ_PORT=15673 docker compose up`.
      - "${RABBITMQ_PORT:-15672}:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  memgraph:
    image: docker.io/memgraph/memgraph-mage:3.12.0
    ports:
      # Bolt (7687) and the log-streaming websocket (7444), published on
      # Memgraph's standard ports so host-side clients and Lab (in the
      # browser) can reach them.
      - "7687:7687"
      - "7444:7444"
    volumes:
      # Snapshots + write-ahead log, so the graph survives restarts.
      - memgraph-data:/var/lib/memgraph

  lab:
    image: docker.io/memgraph/lab:3.12.0
    ports:
      # Host port is configurable to dodge collisions with other projects:
      # `LAB_PORT=3001 docker compose up`. The container always listens on 3000.
      - "${LAB_PORT:-3000}:3000"
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
    depends_on:
      - memgraph

  web:
    <<: *app
    command: sh -c "uv run manage.py migrate && uv run manage.py runserver 0.0.0.0:8000"
    ports:
      # Host port is configurable to dodge collisions with other projects:
      # `WEB_PORT=8001 docker compose up`. The container always listens on 8000.
      - "${WEB_PORT:-8000}:8000"

  worker-urgent:
    <<: *app
    command: uv run celery -A yesterdays worker --loglevel=info -Q urgent

  worker-background:
    <<: *app
    command: uv run celery -A yesterdays worker --loglevel=info -Q background

  beat:
    <<: *app
    command: uv run celery -A yesterdays beat --loglevel=info

  clip:
    build:
      context: services/clip
      dockerfile: Containerfile
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # CPU-only in dev; the vision tower targets the Arc GPU in production.
      CLIP_TEXT_DEVICE: CPU
      CLIP_VISION_DEVICE: CPU
    volumes:
      - ./services/clip/app:/app/app
      # Populated once with `uv run --group export scripts/export_ir.py`
      # from services/clip/ — see docs/dev/deployment/clip-service.md. The
      # service stays up but unready (503) until the bundle exists.
      - ./services/clip/model:/app/model:ro

  vite:
    build: *build
    command: bun run dev --host
    ports:
      # Host port is configurable to dodge collisions with other projects:
      # `VITE_PORT=5174 docker compose up`. The container always listens on 5173.
      - "${VITE_PORT:-5173}:5173"
    # Mount only frontend source, so the image's node_modules isn't shadowed
    # by the host's (which may be built for a different platform).
    volumes:
      - ./assets:/app/assets
      - ./vite.config.js:/app/vite.config.js
      - ./tsconfig.json:/app/tsconfig.json

volumes:
  postgres-data:
    # External (predates Compose) so `down -v` won't delete the real database.
    # On a fresh machine: `docker volume create georef-postgres-data`, then
    # restore a dump or migrate into it.
    name: georef-postgres-data
    external: true
  memgraph-data:
    # Memgraph's storage directory (snapshots + WAL) holding the Wikidata
    # subject mirror. Regenerable — repopulated from WDQS by Celery Beat —
    # so it's safe to drop.
    name: memgraph-data
