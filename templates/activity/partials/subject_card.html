{% load activity_tags %}
<div class="card mb-3">
    <div class="card-body">
        <div class="d-flex align-items-start">
            <div class="me-3">
                <span class="badge bg-primary rounded-circle p-2">
                    <i class="fas fa-tag"></i>
                </span>
            </div>

            <div class="flex-grow-1">
                {% if subject.image %}
                    <a href="{% url 'images:image_detail' subject.image.id %}" class="float-sm-end ms-sm-3 mb-2 mb-sm-0 d-none d-sm-block">
                        <img src="{% if subject.image.thumbnail %}{{ subject.image.thumbnail }}{% else %}{{ subject.image.display_permalink }}{% endif %}"
                             alt="{{ subject.image.title|default:'Image' }}"
                             class="rounded activity-thumbnail-lg"
                             loading="lazy">
                    </a>
                {% endif %}

                <div class="d-flex justify-content-between align-items-start">
                    <div class="flex-grow-1">
                        <h6 class="mb-1">
                            Subject 
                            <a href="{{ subject.subject.get_absolute_url }}" class="text-decoration-none fw-bold">
                                {{ subject.subject.title|capfirst }}
                            </a>
                            added to
                            <a href="{% url 'images:image_detail' subject.image.id %}" class="text-decoration-none">
                                {{ subject.image.title|default:"an image"|truncatechars:40 }}
                            </a>
                        </h6>
                        <small class="text-muted">
                            <i class="fas fa-clock me-1"></i>{{ subject.created_at|timeago }}
                        </small>
                    </div>

                    {% if subject.image %}
                        <div class="ms-3 flex-shrink-0 d-sm-none">
                            <a href="{% url 'images:image_detail' subject.image.id %}" class="d-block">
                                <img src="{% if subject.image.thumbnail %}{{ subject.image.thumbnail }}{% else %}{{ subject.image.display_permalink }}{% endif %}"
                                     alt="{{ subject.image.title|default:'Image' }}"
                                     class="rounded activity-thumbnail"
                                     loading="lazy">
                            </a>
                        </div>
                    {% endif %}
                </div>
                
                </div>
        </div>
    </div>
</div>
