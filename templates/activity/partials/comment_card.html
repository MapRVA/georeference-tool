{% load activity_tags %}
<div class="card mb-3">
    <div class="card-body">
        <div class="d-flex align-items-start">
            <div class="me-3">
                <span class="badge bg-info rounded-circle p-2">
                    <i class="fas fa-comment"></i>
                </span>
            </div>
            <div class="flex-grow-1">
                {% if comment.image %}
                    <a href="{% url 'images:image_detail' comment.image.id %}" class="float-sm-end ms-sm-3 mb-2 mb-sm-0 d-none d-sm-block">
                        <img src="{% if comment.image.thumbnail %}{{ comment.image.thumbnail }}{% else %}{{ comment.image.permalink }}{% endif %}"
                             alt="{{ comment.image.title|default:'Image' }}"
                             class="rounded activity-thumbnail-lg"
                             loading="lazy">
                    </a>
                {% endif %}

                <div class="d-flex justify-content-between align-items-start">
                    <div class="flex-grow-1">
                        <h6 class="mb-1">
                            <a href="{% url 'user_profile' comment.commented_by.get_display_name %}" class="text-decoration-none">
                                {{ comment.commented_by.get_display_name }}
                            </a>
                            commented on
                            <a href="{% url 'images:image_detail' comment.image.id %}" class="text-decoration-none">
                                {{ comment.image.title|default:"an image"|truncatechars:40 }}
                            </a>
                        </h6>
                        <small class="text-muted">
                            <i class="fas fa-clock me-1"></i>{{ comment.created_at|timeago }}
                        </small>
                    </div>

                    {% if comment.image %}
                        <div class="ms-3 flex-shrink-0 d-sm-none">
                            <a href="{% url 'images:image_detail' comment.image.id %}" class="d-block">
                                <img src="{% if comment.image.thumbnail %}{{ comment.image.thumbnail }}{% else %}{{ comment.image.permalink }}{% endif %}"
                                     alt="{{ comment.image.title|default:'Image' }}"
                                     class="rounded activity-thumbnail"
                                     loading="lazy">
                            </a>
                        </div>
                    {% endif %}
                </div>

                <div class="mt-2 p-2 bg-body-secondary rounded comment-preview small"
                     x-data="{ expanded: false, overflows: false }"
                     x-init="$nextTick(() => { overflows = $refs.content.scrollHeight > $refs.content.clientHeight })">
                    <div class="markdown-content comment-collapsed"
                         :class="{ 'comment-collapsed': !expanded }"
                         x-ref="content">{{ comment.text_html|safe }}</div>
                    <button x-show="overflows && !expanded"
                            x-cloak
                            @click="expanded = true"
                            class="btn btn-link btn-sm p-0 mt-1 text-muted">
                        <i class="fas fa-chevron-down me-1"></i>Show more
                    </button>
                    <button x-show="expanded"
                            x-cloak
                            @click="expanded = false"
                            class="btn btn-link btn-sm p-0 mt-1 text-muted">
                        <i class="fas fa-chevron-up me-1"></i>Show less
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
