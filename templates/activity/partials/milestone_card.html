{% load activity_tags %}
<div class="card mb-3 border-warning">
    <div class="card-body">
        <div class="d-flex align-items-start">
            <div class="me-3">
                <span class="badge bg-warning text-dark rounded-circle p-2">
                    <i class="fas fa-fire"></i>
                </span>
            </div>
            <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="mb-1">
                            {% if milestone.user.get_profile_url %}
                                <a href="{{ milestone.user.get_profile_url }}" class="text-decoration-none">
                                    {{ milestone.user.get_display_name }}
                                </a>
                            {% else %}
                                {{ milestone.user.get_display_name }}
                            {% endif %}
                            reached <strong>{{ milestone.count }}</strong> georeferences!
                        </h6>
                        <small class="text-muted">
                            <i class="fas fa-clock me-1"></i>{{ milestone.reached_at|timeago }}
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
