{% load activity_tags %}
{% with collection=introduction.collection %}
<div class="card mb-3 bg-primary text-light">
    <div class="card-body">
        <div class="d-flex align-items-center">
            <div class="me-3">
                <span class="badge bg-body text-body rounded-circle p-2">
                    <i class="fas fa-gift"></i>
                </span>
            </div>
            <div class="flex-grow-1">
                <h6 class="mb-0">
                    New Collection:
                    <a href="{{ collection.get_absolute_url }}" class="text-white fw-bold">
                        {{ collection.name }}
                    </a>
                </h6>
            </div>
        </div>
    </div>
</div>
{% endwith %}
