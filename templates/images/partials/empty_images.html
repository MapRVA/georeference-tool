<div class="text-center py-5">
    <i class="fas {% if empty_icon %}{{ empty_icon }}{% else %}fa-images{% endif %} fa-3x text-muted mb-3"></i>
    <h3 class="text-muted">No Images</h3>
    <p class="text-muted">{{ empty_message }}</p>
    {% if staff_action_url and user.is_staff %}
        <a href="{{ staff_action_url }}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>{{ staff_action_text }}
        </a>
    {% endif %}
    {% if staff_message and user.is_staff %}
        <p class="text-muted small mt-2">{{ staff_message }}</p>
    {% endif %}
</div>
