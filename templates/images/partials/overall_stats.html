<div class="card">
    <div class="card-body">
        <h5 class="card-title"><i class="fas fa-chart-bar me-2"></i>Overall Statistics</h5>
        <div class="row text-center">
            <div class="col-md-3 mb-3 mb-md-0">
                <div class="h3 text-primary mb-1">{{ overall_stats.total_sources }}</div>
                <small class="text-muted">Total Sources</small>
            </div>
            <div class="col-md-3 mb-3 mb-md-0">
                <div class="h3 text-info mb-1">{{ overall_stats.total_collections }}</div>
                <small class="text-muted">Total Collections</small>
            </div>
            <div class="col-md-3 mb-3 mb-md-0">
                <div class="h3 text-warning mb-1">{{ overall_stats.total_images }}</div>
                <small class="text-muted">Total Images</small>
            </div>
            <div class="col-md-3 mb-3 mb-md-0">
                <div class="h3 text-success mb-1">{{ overall_stats.total_georeferenced }}</div>
                <small class="text-muted">Georeferenced</small>
            </div>
        </div>
    </div>
</div>
