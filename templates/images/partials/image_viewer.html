<div class="image-container position-relative">
    {% if image.iiif_url %}
    <!-- IIIF deep-zoom viewer -->
    <div id="osd-viewer"
         data-iiif-url="{{ image.iiif_url }}/info.json"
         style="width: 100%;">
    </div>
    {% else %}
    <!-- Fallback: plain image -->
    <div class="image-centerline"></div>
    <img id="main-image" src="{{ image.display_permalink }}"
         {% if image.thumbnail %}data-thumbnail="{{ image.thumbnail }}"{% endif %}
         alt="{% if image.title %}{{ image.title }}{% else %}Image #{{ image.id }}{% endif %}"
         class="img-fluid w-100"
         fetchpriority="high">
    {% if image.thumbnail %}
    <div id="image-loading-bar" class="position-absolute bottom-0 start-0 w-100" style="z-index: 2;">
        <div class="progress" style="height: 4px; border-radius: 0; background-color: rgba(0,0,0,0.2);">
            <div id="image-loading-progress" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
        </div>
    </div>
    <script>
        (function() {
            var img = document.getElementById('main-image');
            var fullSrc = img.src;
            var thumbSrc = img.dataset.thumbnail;
            var loadingBar = document.getElementById('image-loading-bar');
            var progressBar = document.getElementById('image-loading-progress');

            img.src = thumbSrc;

            var xhr = new XMLHttpRequest();
            xhr.open('GET', fullSrc, true);
            xhr.responseType = 'blob';

            xhr.onprogress = function(e) {
                if (e.lengthComputable) {
                    var percent = (e.loaded / e.total) * 100;
                    progressBar.style.width = percent + '%';
                } else {
                    progressBar.style.width = '100%';
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    var blob = xhr.response;
                    var objectUrl = URL.createObjectURL(blob);
                    img.onload = function() { URL.revokeObjectURL(objectUrl); };
                    img.src = objectUrl;
                }
                loadingBar.style.display = 'none';
            };

            xhr.onerror = function() {
                loadingBar.style.display = 'none';
            };

            xhr.send();
        })();
    </script>
    {% endif %}

    <!-- Fallback for broken images -->
    <div id="image-fallback" class="bg-light align-items-center justify-content-center position-absolute w-100 h-100" style="top: 0; left: 0; min-height: 400px; display: none; z-index: 1;">
        <div class="text-center">
            <i class="fas fa-image fa-4x text-muted mb-3"></i>
            <p class="text-muted mb-3">Image could not be loaded</p>
            <a href="{{ image.original_url }}" target="_blank" class="btn btn-outline-primary">
                <i class="fas fa-external-link-alt me-1"></i>View Original Image
            </a>
        </div>
    </div>
    {% endif %}
</div>
