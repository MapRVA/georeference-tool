<!-- Filter Cards Partial -->
<!-- Provides filtering UI for image grids -->
<!-- The Filters button is in grid_toolbar.html; this partial contains only the collapsible panel -->

{% csrf_token %}
<!-- Filter Panel (collapsible) -->
<div class="collapse" id="georeferenceFilterPanel">
    <div class="card card-body mt-2">
            <div class="row g-3">
                <!-- Georeference Status Dropdown -->
                <div class="col-md-3">
                    <label class="form-label small">Georeference Status</label>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-secondary dropdown-toggle" type="button" id="georeferenceStatusDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <span id="georeferenceStatusText">All</span>
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="georeferenceStatusDropdown">
                            <li>
                                <div class="dropdown-item">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="status_georeferenced"
                                               {% if not request.GET.georeference_status or 'georeferenced' in request.GET.georeference_status %}checked{% endif %}>
                                        <label class="form-check-label" for="status_georeferenced">
                                            <i class="fas fa-map-marker-alt text-success me-1"></i>Georeferenced
                                        </label>
                                    </div>
                                </div>
                            </li>
                            <li>
                                <div class="dropdown-item">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="status_pending"
                                               {% if not request.GET.georeference_status or 'pending' in request.GET.georeference_status %}checked{% endif %}>
                                        <label class="form-check-label" for="status_pending">
                                            <i class="fas fa-clock text-warning me-1"></i>Available
                                        </label>
                                    </div>
                                </div>
                            </li>
                            <li>
                                <div class="dropdown-item">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="status_will_not_georef"
                                               {% if not request.GET.georeference_status or 'will_not_georef' in request.GET.georeference_status %}checked{% endif %}>
                                        <label class="form-check-label" for="status_will_not_georef">
                                            <i class="fas fa-ban text-secondary me-1"></i>Will Not Georeference
                                        </label>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Year Range Filters -->
                <div class="col-md-2">
                    <label for="startYear" class="form-label small">Start Year</label>
                    <input type="number" class="form-control form-control-sm" id="startYear"
                           placeholder="1850" min="1000" max="2030"
                           value="{{ request.GET.start_year }}">
                </div>
                <div class="col-md-2">
                    <label for="endYear" class="form-label small">End Year</label>
                    <input type="number" class="form-control form-control-sm" id="endYear"
                           placeholder="1950" min="1000" max="2030"
                           value="{{ request.GET.end_year }}">
                </div>

                <!-- Subject Filters -->
                <div class="col-md-5">
                    <label class="form-label small">Subject Filter</label>
                    <div class="mb-2">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="subjectOptions"
                                   id="withSubjects" value="with"
                                   {% if request.GET.with_subjects or not request.GET.without_subjects and not request.GET.no_subjects %}checked{% endif %}
                                   onchange="updateSubjectMode()">
                            <label class="form-check-label small" for="withSubjects">
                                With subjects
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="subjectOptions"
                                   id="withoutSubjects" value="without"
                                   {% if request.GET.without_subjects %}checked{% endif %}
                                   onchange="updateSubjectMode()">
                            <label class="form-check-label small" for="withoutSubjects">
                                Without subjects
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="subjectOptions"
                                   id="noSubjects" value="none"
                                   {% if request.GET.no_subjects == 'true' %}checked{% endif %}
                                   onchange="updateSubjectMode()">
                            <label class="form-check-label small" for="noSubjects">
                                No subjects
                            </label>
                        </div>
                    </div>
                    <div id="subject-search-wrapper" class="position-relative"
                         style="{% if request.GET.no_subjects == 'true' %}display: none;{% endif %}">
                        <input type="text" id="subjectSearchInput" class="form-control form-control-sm"
                               placeholder="Type to search subjects...">
                        <div id="selected-subjects" class="mt-2 d-flex flex-wrap gap-1">
                            <!-- Selected subject pills will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

        <!-- Apply and Clear buttons -->
        <div class="row mt-3">
            <div class="col-12">
                <button type="button" class="btn btn-primary btn-sm" onclick="applyFilters()">
                    <i class="fas fa-check me-1"></i>Apply Filters
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm ms-2" onclick="clearFilters()">
                    <i class="fas fa-circle-xmark me-1"></i>Clear All
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Styles for x-cloak and autocomplete -->
<style>
    [x-cloak] { display: none !important; }

    /* Autocomplete styling */
    .autoComplete_wrapper > ul {
        border: 1px solid var(--bs-border-color);
        border-radius: var(--bs-border-radius);
        background-color: var(--bs-body-bg);
        margin-top: 0.25rem;
        box-shadow: var(--bs-box-shadow);
        position: absolute;
        z-index: 1000;
        width: 100%;
        max-height: 300px;
        overflow-y: auto;
    }
    .autoComplete_wrapper > ul > li {
        padding: 0.5rem 1rem;
        cursor: pointer;
    }
    .autoComplete_wrapper > ul > li:hover {
        background-color: #e9ecef;
    }
    .autoComplete_wrapper > ul > li[aria-selected="true"] {
        background-color: #0d6efd;
        color: white;
    }
</style>
