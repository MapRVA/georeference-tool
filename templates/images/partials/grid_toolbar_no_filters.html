<!-- Grid Toolbar - Bulk Selection Controls Only (no filters) -->
<!-- Used within an imageGrid() Alpine component context -->
<!-- For pages like search.html that have their own filtering UI -->

<div class="mb-3">
    <!-- Bulk Selection Button -->
    {% if user.is_authenticated %}
    <button class="btn btn-sm"
            :class="selectionMode ? 'btn-outline-danger' : 'btn-outline-primary'"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#bulkActionsToolbar"
            @click="toggleSelectionMode()">
        <i class="fas" :class="selectionMode ? 'fa-circle-xmark' : 'fa-square-check'"></i>
        <span x-text="selectionMode ? 'Exit Selection' : 'Select Images'" class="ms-1"></span>
    </button>
    {% endif %}

    <!-- Bulk Actions Toolbar (visible when selection mode is active) -->
    {% if user.is_authenticated %}
    <div class="collapse" id="bulkActionsToolbar">
        <div class="mt-2 p-2 border rounded">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                <div class="d-flex align-items-center gap-2">
                    <span class="text-muted small">
                        <span x-text="selectedCount"></span> images selected
                    </span>
                    <button class="btn btn-sm btn-outline-secondary" @click="selectAll()">Select All</button>
                    <button class="btn btn-sm btn-outline-secondary" @click="deselectAll()">Deselect All</button>
                </div>
                <div class="d-flex gap-2">
                    <div class="dropdown d-inline-block">
                        <button class="btn btn-sm btn-primary dropdown-toggle"
                                type="button"
                                data-bs-toggle="dropdown"
                                :disabled="selectedCount === 0">
                            Bulk Actions
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <button class="dropdown-item" type="button" @click="$dispatch('show-add-subject-modal')">
                                    <i class="fas fa-tag me-2"></i>Add Subject
                                </button>
                            </li>
                            <li>
                                <button class="dropdown-item" type="button" @click="$dispatch('show-add-to-album-modal')">
                                    <i class="fas fa-photo-video me-2"></i>Add to Album
                                </button>
                            </li>
                            {% if user.is_staff %}
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <button class="dropdown-item" type="button" @click="$dispatch('bulk-mark-aerial')">
                                    <i class="fas fa-plane me-2"></i>Mark as From Above
                                </button>
                            </li>
                            <li>
                                <button class="dropdown-item" type="button" @click="$dispatch('bulk-mark-will-not-georef')">
                                    <i class="fas fa-ban me-2"></i>Mark as Will Not Georeference
                                </button>
                            </li>
                            {% endif %}
                        </ul>
                    </div>
                    <button class="btn btn-sm btn-outline-danger"
                            data-bs-toggle="collapse"
                            data-bs-target="#bulkActionsToolbar"
                            @click="toggleSelectionMode()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    {% endif %}
</div>
