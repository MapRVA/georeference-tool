{% extends "base.html" %}

{% block title %}Revoke Access? — Yesterdays{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title h4 mb-3">
                    <i class="fas fa-exclamation-triangle text-warning me-2"></i>Revoke access?
                </h2>
                <p class="text-muted mb-4">
                    The application will no longer be able to act on your behalf.
                    If you use it again you'll need to re-authorize it.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'oauth2_provider:authorized-token-list' %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-times me-1"></i>Revoke
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
