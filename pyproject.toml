[project]
name = "yesterdays"
version = "0.1.0"
description = "A Django web application for georeferencing historical images."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4~=4.14.3",
    "boto3~=1.42.59",
    "celery[librabbitmq]~=5.6.2",
    "clip",
    "django~=6.0.3",
    "django-celery-results>=2.6.0",
    "django-cors-headers~=4.9.0",
    "django-filter~=25.2",
    "django-prometheus~=2.4.0",
    "django-ratelimit~=4.1.0",
    "django-vite~=3.1.0",
    "djangorestframework~=3.16.1",
    "djangorestframework-gis~=1.2.0",
    "drf-spectacular~=0.29.0",
    "edtf~=5.0.0",
    "flickrapi~=2.4.0",
    "geopy~=2.4.1",
    "iiif-prezi3==3.1.0",
    "markdown~=3.10.2",
    "nh3~=0.3.3",
    "numpy>=2.3.3",
    "osm-login-python~=2.1.0",
    "pillow==12.0.0",
    "psycopg[binary]~=3.3.3",
    "pytesseract>=0.3.13",
    "pyvips>=3.1.1",
    "requests~=2.32.5",
    "torch~=2.10.0",
    "torchvision~=0.25.0",
    "tqdm~=4.67.3",
    "uvicorn[standard]~=0.41.0",
    "whitenoise[brotli]~=6.12.0",
]

[dependency-groups]
docs = ["zensical~=0.0.32"]

[tool.uv]
default-groups = ["docs"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[tool.uv.extra-build-dependencies]
clip = ["setuptools<81"]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git#dcba3cb" }
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
