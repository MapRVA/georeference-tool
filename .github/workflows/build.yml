name: Build container
on:
  push:
    branches:
      - trunk
      - develop

env:
  IMAGE_NAME: yesterdays
  IMAGE_REGISTRY: ghcr.io/maprva
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Get Short Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Check outputs
        run: echo ${{ steps.vars.outputs.sha_short }}

      # Log in before the build so --cache-to can push cache layers to ghcr.
      - name: Log in to registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # layers + a registry-backed cache keep unchanged build steps (apt,
      # torch/uv sync) byte-identical across runs, so pushes and deploy pulls
      # only transfer the layers that actually changed.
      - name: Buildah Action
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.vars.outputs.sha_short }} ${{ github.ref_name }}
          layers: true
          extra-args: |
            --cache-from ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}-cache
            --cache-to ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}-cache
          containerfiles: |
            ./Containerfile

      - name: Push Image
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Echo outputs
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"
