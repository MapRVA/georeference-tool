name: Documentation
on:
  push:
    branches:
      - trunk
    paths:
      - docs/**
      - assets/images/surveillance-direction.png
      - assets/js/components/image_viewer.js
      - assets/js/components/osd_buttons.js
      - assets/styles/components/georeference-joystick.css
      - assets/styles/components/image-viewer.css
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
      - run: uv sync --only-group docs
      - run: uv run --only-group docs zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
